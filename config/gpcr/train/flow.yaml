# @package _global_

loss_coeffs:
  - velocity:
      - 1.0
      - MSELoss
  - sidechain_direction_velocity:
      - 2.0
      - MSELoss

metrics_components:
  - velocity:
      - L1Loss
  - sidechain_direction_velocity:
      - L1Loss

metrics_key: validation_loss
metric_criteria: decreasing

max_epochs: 3000
learning_rate: 5.e-4

batch_size: 8
validation_batch_size: 16
validation_freq: 10
dataloader_num_workers: 8

optimizer_name: AdamW
optimizer_params:
  amsgrad: false
  betas: [0.9, 0.999]
  eps: 1.e-8
  weight_decay: 1.e-5

lr_scheduler_name: ExponentialLR
lr_scheduler_gamma: 0.9995

warmup_epochs: 20
use_ema: true
